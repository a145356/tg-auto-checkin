name: Telegram Auto Checkin

on:
  repository_dispatch:
    types: [ cf_trigger ]
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
          GROUP_IDS: ${{ secrets.GROUP_IDS }}
          CHECKIN_MESSAGE: ${{ secrets.CHECKIN_MESSAGE }}
        run: python cron_run.py
